<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Collider</title>
<style>
  :root{
    --bg:#0d0d0d; --card:#161616; --line:#282828; --soft:#1e1e1e;
    --fg:#f4f4f2; --dim:#9b9b97; --faint:#6c6c68; --ink:#e4e4e1;
    --lime:#e8fb52; --lime-ink:#101010;
    --green:#5fe08a; --green-bg:#112419; --green-line:#1f5134;
    --red:#ff6b6b; --red-bg:#2a1414; --red-line:#7a2828;
    --amber:#f2c14e; --amber-bg:#282011; --amber-line:#5f4b1c;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:light){:root{
    --bg:#f2f2ef; --card:#fff; --line:#e2e2dd; --soft:#ededea;
    --fg:#121212; --dim:#6a6a65; --faint:#9a9a93; --ink:#2a2a28;
    --lime:#e8fb52; --lime-ink:#101010;
    --green:#15803d; --green-bg:#eefaf1; --green-line:#c3e6cd;
    --red:#c02626; --red-bg:#fdf0f0; --red-line:#f0c6c6;
    --amber:#8a6510; --amber-bg:#fbf5e2; --amber-line:#e6d5a4;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:64px 28px 120px;
    font:16px/1.6 ui-sans-serif,-apple-system,"Apple SD Gothic Neo",Pretendard,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto}

  header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:clamp(40px,6vw,64px);line-height:.95;letter-spacing:-.035em;margin:0;
    font-weight:800;text-transform:uppercase}
  .spon{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--lime-ink);
    background:var(--lime);border:1px solid var(--lime);border-radius:999px;padding:7px 14px}
  .credits{margin-left:auto;font:600 12.5px/1 var(--mono);color:var(--dim);
    font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:999px;padding:9px 14px}
  .credits.low{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
  .credits.critical{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
  .lede{color:var(--dim);margin:0 0 44px;font-size:19px;line-height:1.55;max-width:58ch;
    letter-spacing:-.01em}
  .lede b{color:var(--fg);font-weight:600}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:26px 28px;margin-bottom:18px}
  .panel > h2{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--faint);
    margin:0 0 20px;text-transform:uppercase}

  .rows{display:grid;gap:10px;margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center}
  .row input{flex:1;padding:15px 18px;background:var(--soft);border:1px solid var(--line);
    border-radius:14px;color:var(--fg);font:14.5px/1 var(--mono);min-width:0}
  .row input:focus{outline:none;border-color:var(--fg)}
  .row .del{width:48px;height:50px;flex:none;border:1px solid var(--line);border-radius:14px;
    background:transparent;color:var(--faint);cursor:pointer;font-size:17px}
  .row .del:hover{color:var(--red);border-color:var(--red-line)}
  .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{padding:13px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--dim);font:500 13.5px/1 inherit;cursor:pointer}
  .btn:hover{border-color:var(--fg);color:var(--fg)}
  .btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);
    font-weight:800;padding:15px 30px;font-size:14.5px;letter-spacing:-.01em;margin-left:auto}
  .btn.primary:hover{border-color:var(--lime)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .hint{color:var(--faint);font-size:13px;margin-top:14px;max-width:72ch}

  .prs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .prc{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}
  .prc .n{font:700 12px/1 var(--mono);letter-spacing:.06em;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .prc .t{font-size:16px;font-weight:700;letter-spacing:-.015em;margin:10px 0 12px;line-height:1.3}
  .prc .f{font:11.5px/1.7 var(--mono);color:var(--faint);word-break:break-all}

  /* 매트릭스 — 화면의 중심 */
  #matrixBox{overflow-x:auto;padding-bottom:4px}
  table.mx{border-collapse:separate;border-spacing:10px;margin:0 auto}
  table.mx th{font:700 15px/1 var(--mono);color:var(--dim);padding:8px;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  table.mx td{padding:0}
  .cell{width:152px;min-width:152px;height:88px;border-radius:18px;
    border:1px solid var(--line);background:var(--soft);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
    font:700 14.5px/1.3 inherit;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;color:var(--faint);cursor:default}
  .cell.diag{background:transparent;border-color:transparent;color:var(--faint)}
  .cell.click{cursor:pointer}
  .cell.click:hover{border-color:var(--fg)}
  .cell.sel{outline:2px solid var(--fg);outline-offset:3px}
  .cell.running{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
  .cell.safe{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
  .cell.collision{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
  .cell.existing-fail,.cell.conflict{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
  .cell.skipped,.cell.error{background:var(--soft);border-color:var(--line);color:var(--faint)}

  .allrow{display:flex;align-items:center;gap:16px;margin-top:24px;padding-top:22px;
    border-top:1px solid var(--line);flex-wrap:wrap}
  .allrow .lbl{font:700 16px/1.3 var(--mono);color:var(--fg);letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:var(--faint)}
  .legend span{border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:7px;vertical-align:0}
  .lg-safe::before{background:var(--green)}
  .lg-col::before{background:var(--red)}
  .lg-warn::before{background:var(--amber)}
  .lg-pend::before{background:var(--faint)}

  /* 상세 */
  .steps{display:grid;gap:0;margin-bottom:22px}
  .st{display:flex;align-items:center;gap:15px;padding:17px 20px;border:1px solid var(--line);background:var(--soft)}
  .st:first-child{border-radius:18px 18px 0 0}
  .st:last-child{border-radius:0 0 18px 18px}
  .st + .st{border-top:0}
  .st .mk{font-size:18px;width:22px;flex:none;text-align:center}
  .st .nm{font-weight:700;font-size:16px;letter-spacing:-.015em}
  .st .note{color:var(--dim);font-size:13.5px;margin-left:auto;text-align:right}
  .st.ok{background:var(--green-bg);border-color:var(--green-line)}
  .st.ok .mk,.st.ok .nm{color:var(--green)}
  .st.bad{background:var(--red-bg);border-color:var(--red-line)}
  .st.bad .mk,.st.bad .nm{color:var(--red)}
  .st.warn{background:var(--amber-bg);border-color:var(--amber-line)}
  .st.warn .mk,.st.warn .nm{color:var(--amber)}
  .arrow{text-align:center;color:var(--faint);font-size:13px;padding:14px 0}

  .nums{display:flex;gap:64px;flex-wrap:wrap;padding:24px 26px;border:1px solid var(--red-line);
    background:var(--red-bg);border-radius:20px;margin-bottom:18px}
  .nums .k{font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .nums .v{font:800 44px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .nums .want .v{color:var(--green)}
  .nums .got .v{color:var(--red)}

  .hyp{padding:20px 22px;background:var(--soft);border:1px solid var(--line);
    border-radius:18px;margin-bottom:16px;font-size:15.5px;letter-spacing:-.01em}
  .hyp .k{font-size:11px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .hyp .why{color:var(--dim);font-size:14px;letter-spacing:0;margin-top:10px}

  details{border:1px solid var(--line);border-radius:18px;background:var(--soft);margin-top:12px}
  details summary{padding:15px 20px;cursor:pointer;font-size:13.5px;color:var(--dim);font-weight:600}
  details summary::marker{color:var(--faint)}
  details pre{margin:0;padding:0 20px 18px;font:12.5px/1.75 var(--mono);color:var(--ink);
    overflow-x:auto;max-height:300px;white-space:pre-wrap;word-break:break-all}

  #logWrap{margin-top:10px}
  #log{margin:0;padding:0 20px 18px;font:12.5px/1.8 var(--mono);color:var(--dim);
    max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  #log b{color:var(--fg);font-weight:700}
  #log i{color:var(--red);font-style:normal}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Collider</h1>
    <span class="spon">DAYTONA · NOSANA · DNSIMPLE</span>
    <span class="credits" id="credits"></span>
  </header>
  <p class="lede">
    CI는 이 PR이 <b>오늘의 main</b>과 맞는지만 검사합니다.
    곧 머지될 옆 PR과 함께 있어도 괜찮은지는 아무도 검사하지 않습니다.
  </p>

  <div class="panel">
    <h2>열린 PR</h2>
    <div class="rows" id="rows"></div>
    <div class="acts">
      <button class="btn" id="add" type="button">PR 추가</button>
      <button class="btn" id="preset" type="button">데모 3개 넣기</button>
      <button class="btn primary" id="run" type="button">미래 충돌 검사</button>
    </div>
    <div class="hint">같은 저장소의 PR만 함께 검사합니다. 최소 두 개가 필요합니다.</div>
  </div>

  <div class="panel hidden" id="pPrs"><h2>검사 대상</h2><div class="prs" id="prsBox"></div></div>

  <div class="panel hidden" id="pMatrix">
    <h2>미래 충돌 매트릭스</h2>
    <div id="matrixBox"></div>
    <div class="legend">
      <span class="lg-safe">SAFE 함께 있어도 명세대로</span>
      <span class="lg-col">COLLISION 합쳤을 때만 어긋남</span>
      <span class="lg-warn">기존 단계에서 이미 걸림</span>
      <span class="lg-pend">대기 또는 건너뜀</span>
    </div>
  </div>

  <div class="panel hidden" id="pDetail"><h2 id="dTitle">조합 상세</h2><div id="detailBox"></div></div>

  <details id="logWrap" class="hidden"><summary>실행 로그</summary><pre id="log"></pre></details>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const PRESET = ['currenjin/collider-demo#1','currenjin/collider-demo#2','currenjin/collider-demo#3'];

let prList = [];        // plan 에서 받은 PR 목록
let combos = [];        // { label, prNums[], state, data }
let selected = null;

/* ── 입력 행 ───────────────────────────────────────── */
function addRow(value = '') {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `<input placeholder="owner/repo#1" value="${esc(value)}" autocomplete="off" />
                  <button class="del" type="button" title="삭제">×</button>`;
  el.querySelector('.del').onclick = () => {
    if ($('rows').children.length > 2) el.remove();
  };
  $('rows').appendChild(el);
}
function readRows() {
  return [...$('rows').querySelectorAll('input')].map((i) => i.value.trim()).filter(Boolean);
}
addRow(); addRow();
$('add').onclick = () => addRow();
$('preset').onclick = () => {
  $('rows').innerHTML = '';
  PRESET.forEach((p) => addRow(p));
};

/* ── 로그 ─────────────────────────────────────────── */
function line(t, cls) {
  const o = cls ? `<${cls}>` : '', c = cls ? `</${cls}>` : '';
  $('log').insertAdjacentHTML('beforeend', o + esc(t) + c + '\n');
  $('log').scrollTop = $('log').scrollHeight;
}

/* ── 매트릭스 ─────────────────────────────────────── */
const MARK = {
  pending:'⚪ 대기', running:'검사 중', safe:'🟢 SAFE', collision:'🔴 COLLISION',
  'existing-fail':'🟡 기존 실패', conflict:'🟡 GIT 충돌', skipped:'건너뜀', error:'오류',
};
function findCombo(nums) {
  return combos.find((c) => c.prNums.length === nums.length && c.prNums.every((n, i) => n === nums[i]));
}
function renderMatrix() {
  const n = prList.length;
  const pairs = combos.filter((c) => c.prNums.length === 2);
  const all = combos.find((c) => c.prNums.length > 2);

  let html = '<table class="mx"><tr><th></th>';
  for (const p of prList) html += `<th>#${p.number}</th>`;
  html += '</tr>';

  for (let i = 0; i < n; i++) {
    html += `<tr><th>#${prList[i].number}</th>`;
    for (let j = 0; j < n; j++) {
      if (j <= i) {
        html += `<td><div class="cell diag">${i === j ? '—' : ''}</div></td>`;
      } else {
        const c = findCombo([prList[i].number, prList[j].number]);
        const st = c ? c.state : 'pending';
        const clickable = c && ['safe','collision','existing-fail','conflict'].includes(st);
        html += `<td><div class="cell ${st} ${clickable ? 'click' : ''}"
                   data-label="${c ? esc(c.label) : ''}">${MARK[st] ?? st}</div></td>`;
      }
    }
    html += '</tr>';
  }
  html += '</table>';

  if (all) {
    const clickable = ['safe','collision','existing-fail','conflict'].includes(all.state);
    html += `<div class="allrow"><span class="lbl">${esc(all.label)}</span>
      <div class="cell ${all.state} ${clickable ? 'click' : ''}" style="width:120px"
        data-label="${esc(all.label)}">${MARK[all.state] ?? all.state}</div></div>`;
  }

  $('matrixBox').innerHTML = html;
  $('matrixBox').querySelectorAll('.cell.click').forEach((el) => {
    el.onclick = () => showDetail(el.dataset.label);
    if (el.dataset.label === selected) el.classList.add('sel');
  });
  $('pMatrix').classList.remove('hidden');
}

/* ── 상세 ─────────────────────────────────────────── */
function step(cls, mark, name, note) {
  return `<div class="st ${cls}"><div class="mk">${mark}</div><div class="nm">${name}</div>
          <div class="note">${esc(note ?? '')}</div></div>`;
}
function showDetail(label) {
  const c = combos.find((x) => x.label === label);
  if (!c) return;
  selected = label;
  $('dTitle').textContent = c.label;

  const d = c.data;
  let html = '<div class="steps">';

  if (c.state === 'conflict') {
    html += step('warn','!','git merge','텍스트 충돌. 지금 쓰는 도구도 잡습니다');
  } else {
    html += step('ok','✓','git merge','충돌 없음');
    if (d.existing) {
      const ok = d.existing.passed;
      html += step(ok ? 'ok' : 'warn', ok ? '✓' : '!', '기존 테스트',
        ok ? `${d.existing.total}개 전부 통과` : `${d.existing.failed}/${d.existing.total} 실패`);
    }
    if (c.state === 'existing-fail') {
      html += '</div><div class="hint">기존 테스트가 이미 실패하므로 상호작용 테스트를 만들지 않았습니다. Nosana 추론을 건너뛰어 크레딧을 아낍니다.</div>';
      $('detailBox').innerHTML = html; $('pDetail').classList.remove('hidden'); renderMatrix(); return;
    }
    html += '</div><div class="arrow">↓ 이 상호작용을 커버하는 테스트가 저장소에 없습니다. Collider 가 만듭니다</div><div class="steps">';
    const bad = c.state === 'collision';
    html += step(bad ? 'bad' : 'ok', bad ? '✕' : '✓', '생성한 상호작용 테스트',
      bad ? '실패' : '통과');
  }
  html += '</div>';

  if (d.assertion && (d.assertion.expected || d.assertion.actual)) {
    html += `<div class="nums">
      <div class="want"><div class="k">명세상 기대</div><div class="v">${esc(d.assertion.expected ?? '—')}</div></div>
      <div class="got"><div class="k">실제</div><div class="v">${esc(d.assertion.actual ?? '—')}</div></div>
    </div>`;
  }
  if (d.hypothesis) {
    html += `<div class="hyp"><div class="k">어디서 겹치는가</div>
      <div>${esc(d.hypothesis.collisionPoint)}</div>
      <div class="why">${esc(d.hypothesis.reasoning)}</div></div>`;
  }
  if (d.test) {
    html += `<details open><summary>생성한 테스트 (저장소에 없던 코드)</summary><pre>${esc(d.test)}</pre></details>`;
  }
  if (d.output) {
    html += `<details><summary>실행 출력</summary><pre>${esc(d.output)}</pre></details>`;
  }

  $('detailBox').innerHTML = html;
  $('pDetail').classList.remove('hidden');
  renderMatrix();
}

/* ── 실행 ─────────────────────────────────────────── */
$('run').onclick = async () => {
  const prs = readRows();
  if (prs.length < 2) { alert('PR 을 두 개 이상 입력하세요.'); return; }

  $('run').disabled = true;
  prList = []; combos = []; selected = null;
  $('log').textContent = '';
  $('logWrap').classList.remove('hidden');
  ['pPrs','pMatrix','pDetail'].forEach((p) => $(p).classList.add('hidden'));

  try {
    const res = await fetch('/api/collide', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ prs }),
    });
    if (!res.body) throw new Error('스트림을 열 수 없습니다.');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (chunk.startsWith('data:')) handle(JSON.parse(chunk.slice(5).trim()));
      }
    }
  } catch (err) {
    line('실패: ' + (err?.message || err), 'i');
  } finally {
    $('run').disabled = false;
  }
};

function setCredits(c) {
  if (!c) return;
  const el = $('credits');
  el.textContent = `Nosana ${c.free.toFixed(2)} / ${c.assigned}`;
  el.className = 'credits ' + (c.level === 'ok' ? '' : c.level);
}

function handle(m) {
  switch (m.event) {
    case 'log': line('  ' + m.message); break;
    case 'phase': line(m.name, 'b'); break;
    case 'credits': setCredits(m); break;

    case 'plan':
      prList = m.prs;
      combos = m.combos.map((label) => ({
        label,
        prNums: label.split('+').map((s) => Number(s.trim().replace('#',''))),
        state: 'pending',
        data: {},
      }));
      $('prsBox').innerHTML = m.prs.map((p) =>
        `<div class="prc"><div class="n">#${p.number}</div><div class="t">${esc(p.title)}</div>
         <div class="f">${p.files.map(esc).join('<br>')}</div></div>`).join('');
      $('pPrs').classList.remove('hidden');
      renderMatrix();
      break;

    case 'combo:start':
      combos[m.index].state = 'running'; renderMatrix(); break;

    case 'combo:existing':
      combos[m.index].data.existing = { passed:m.passed, total:m.total, failed:m.failed };
      break;

    case 'combo:hypothesis':
      combos[m.index].data.hypothesis = { collisionPoint:m.collisionPoint, reasoning:m.reasoning };
      break;

    case 'combo:test':
      combos[m.index].data.test = m.content; break;

    case 'combo:done': {
      const c = combos[m.index];
      c.state = m.verdict === 'existing-fail' ? 'existing-fail' : m.verdict;
      c.data.assertion = m.assertion;
      c.data.output = m.output;
      renderMatrix();
      // 첫 충돌을 자동으로 펼친다. 발표에서 클릭 한 번을 아낀다
      if (m.verdict === 'collision' && !selected) showDetail(c.label);
      break;
    }

    case 'error': line('실패: ' + m.message, 'i'); break;
    case 'done':
      setCredits(m.credits);
      line(`완료 ${(m.elapsedMs/1000).toFixed(1)}초`, 'b');
      break;
  }
}

fetch('/api/credits').then((r) => r.json()).then((d) => setCredits(d.nosana)).catch(() => {});
</script>
